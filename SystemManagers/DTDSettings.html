<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DTD Settings Hub</title>
</head>
<body style="background-color: black;">
  <div id="mainmenu">
  <h1 style="text-align: center; color: white;">DTD OS Settings:</h1>
  
  <button id="dbgs" style="background-color: lime; padding: 20px 30px; border-color: white; color: white; font-weight: bold;">Debug Session</button>
  </div>
  <div id="dbgsession">
    <h1 style="color: lime">DEBUG SESSION:</h1>
    <button id="dbgback" style="background-color: red; padding: 20px 20px; border-color: white; color: white; font-weight: bold;">[<]</button>
       
      <a style="font-weight: bold; color: cyan;" href="https://raw.githubusercontent.com/nathanc0dxxx-cpu/DTD/main/DTDOS.lua">DTDPS Content</a>
  </div>
<script>
    const button = document.getElementById("dbgs");
    const div = document.getElementById("mainmenu");
    const div2 = document.getElementById("dbgsession");
  div2.style.display = "none";
    button.onclick = () => {
      div.style.display = "none";
      div2.style.display = "block";
    }
    const button2 = document.getElementById("dbgback");
    button2.onclick = () => {
      div2.style.display = "none";
      div.style.display = "block";
    }
</script>
</body>
</html>
